name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Quality (format · lint · types · unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:pin-age
      - run: pnpm check:audit
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total;console.log('### Coverage\n\n| Metric | % |\n|---|---|\n'+['lines','statements','functions','branches'].map(k=>'| '+k+' | '+t[k].pct+' |').join('\n'))" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 7

  e2e:
    name: E2E (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:size
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the test browser
        timeout-minutes: 3
        run: |
          for attempt in 1 2; do
            timeout 85 pnpm exec playwright install chromium && exit 0
            echo "::warning::Browser install attempt $attempt failed or stalled"
          done
          exit 1
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker build & smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: capsense:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container and wait for HEALTHCHECK
        run: |
          docker run -d --name capsense -p 3000:3000 capsense:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' capsense)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          echo "health=$status"
          test "$status" = "healthy"
          test "$(docker exec capsense id -u)" != "0"
          curl -fsS -o /dev/null http://127.0.0.1:3000/
      - if: always()
        run: docker logs capsense || true

  pr-title:
    name: PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  azure-boards-link:
    name: Azure Boards link (AB#)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: PR description references a work item
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -Eq 'AB#[0-9]+'; then
            echo "Found: $(printf '%s' "$BODY" | grep -Eo 'AB#[0-9]+' | sort -u | tr '\n' ' ')"
          else
            echo "::error::Add 'AB#<work item id>' to the PR description (ways-of-working §6)."
            exit 1
          fi
