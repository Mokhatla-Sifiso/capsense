name: Claude review

# Automated first-pass code review. Dispatched by "ADO In Review trigger" when the linked Azure DevOps
# work item moves to In Review; can also be run manually. Final review and merge are done by the
# reviewer (Muzi's Claude Code session).
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      work_item:
        description: Azure DevOps work item id (AB#)
        required: false
        type: string

concurrency:
  group: claude-review-${{ inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    name: Claude review PR #${{ inputs.pr_number }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 0
      - name: Load Azure DevOps ticket (acceptance criteria, DoD)
        if: inputs.work_item != ''
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
          ADO_ORG: ${{ vars.ADO_ORG }}
          ADO_PROJECT: ${{ vars.ADO_PROJECT }}
          WORK_ITEM: ${{ inputs.work_item }}
        run: python3 .github/scripts/ado_ticket.py "$WORK_ITEM" > "$RUNNER_TEMP/ado-ticket.md"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*),Bash(gh pr comment:*),Bash(git log:*),Bash(git diff:*),Bash(cat:*)"
          prompt: |
            You are the code reviewer for CapSense (Capitec Front-End take-home), repository ${{ github.repository }}.
            Review pull request #${{ inputs.pr_number }} for Azure DevOps work item AB#${{ inputs.work_item }}.

            Context to read first:
            - The ticket, if present: ${{ runner.temp }}/ado-ticket.md (objective, Given/When/Then acceptance criteria, DoR/DoD).
            - Standards: docs/delivery/ways-of-working.md, docs/architecture/adr-*.md, docs/architecture/nfr.md,
              docs/requirements/functional-requirements.md, docs/design/screen-spec.md, docs/design/tokens.md.
            - The diff: `gh pr diff ${{ inputs.pr_number }}` and `gh pr view ${{ inputs.pr_number }}`.

            Check, in this order, and only report real problems with file:line evidence:
            1. Every acceptance criterion in the ticket is implemented and has a test (unit/component or e2e).
            2. Correctness and edge cases; loading, error, empty and populated states (FR-26).
            3. Accessibility (WCAG 2.2 AA): semantics, keyboard, focus, names, contrast tokens, no colour-only cues.
            4. Architecture: ADR-001–007 (RSC prefetch + HydrationBoundary, TanStack Query keys, nuqs URL state,
               Zod at boundaries, route handlers + seed, Phosphor icons, Nunito Sans self-hosted, tokens only).
            5. TypeScript strict, no `any`, named exports in shared code, no inline styles, no PII in URL/console/storage (FR-31).
            6. Tests are meaningful and deterministic; CI must stay green.

            Output: submit ONE review with `gh pr review ${{ inputs.pr_number }} --comment --body-file <file>` containing
            a verdict line (APPROVE-READY or CHANGES-REQUESTED), a table of findings (severity · file:line · issue · fix),
            and the AC checklist with ✅/❌. Do not approve or request changes formally; the human reviewer merges.
