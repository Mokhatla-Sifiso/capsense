name: AI review reset

# New commits on a reviewed PR make it eligible for another automated review on the next poll.
on:
  pull_request_target:
    types: [synchronize]

permissions:
  pull-requests: write

jobs:
  reset:
    if: contains(github.event.pull_request.labels.*.name, 'ai-review:done')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --remove-label ai-review:done
